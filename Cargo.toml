[workspace]
resolver = "2"
members = ["src-tauri", "features/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.com/andre1gr4ce/MCode"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep release builds lean — MCode is meant to be lightweight.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
